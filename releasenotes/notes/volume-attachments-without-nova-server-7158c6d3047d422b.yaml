---
fixes:
  - |
    [`bug 1961560 <https://bugs.launchpad.net/horizon/+bug/1961560>`__]
    Volumes attached without Nova no longer break the volume panels. Cinder
    does not require an attachment to belong to a Nova server: os-brick's
    local-attach and Glance's cinder store leave the server unset, while
    standalone Ironic and Zun record their own node or container UUID.
    Horizon looked such attachments up in Nova anyway, so the volume list
    showed "Instance None could not be found" and the volume detail, extend,
    edit and other volume pages failed to load. These attachments are now
    shown by their host name (or the recorded ID) without a link to an
    instance. Attachments without a server cannot be detached from Horizon,
    since detaching goes through Nova.
